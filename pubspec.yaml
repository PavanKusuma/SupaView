name: supaview
description: Speech analysis app for interview preparation. Analyze pauses, filler words, confidence and more.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  camera: ^0.11.0+2
  speech_to_text: ^7.0.0
  provider: ^6.1.2
  fl_chart: ^0.69.2
  path_provider: ^2.1.5
  intl: ^0.19.0
  permission_handler: ^11.3.1
  uuid: ^4.5.1
  percent_indicator: ^4.2.3
  google_fonts: ^6.2.1
  http: ^1.2.2
  shared_preferences: ^2.3.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/
